<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>عرض الفيديو</title>
</head>
<body>

    <!-- Header -->
    <header class="main-header">
        <div class="header-right">
            <button class="back-btn" onclick="goBack()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
                رجوع
            </button>
        </div>
        <div class="header-center">
            <span class="logo-icon">🎬</span>
            <span class="logo-text">Safety Videos</span>
        </div>
        <div class="header-left">
            <span id="userName" class="user-name-display"></span>
        </div>
    </header>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <span id="breadcrumbText">...</span>
    </div>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Video Container -->
        <div class="video-wrapper" id="videoWrapper">
            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <p>جاري تحميل الفيديو...</p>
            </div>
            <div class="no-video-state hidden" id="noVideoState">
                <span>🎬</span>
                <p>لا يوجد فيديو لهذا المستوى والمادة بعد</p>
            </div>
            <!-- Video element injected by JS -->
        </div>

        <!-- Video Info -->
        <div class="video-info hidden" id="videoInfo">
            <h2 id="videoTitle">عنوان الفيديو</h2>
            <p id="videoDesc" class="video-desc"></p>
        </div>

    </main>

    <script src="script/script.js"></script>
</body>
</html>
