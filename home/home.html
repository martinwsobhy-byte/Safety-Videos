<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>الرئيسية</title>
</head>
<body>

    <!-- Header -->
    <header class="main-header">
        <div class="header-logo">
            <span>🎬</span>
            <span class="logo-text">Safety Videos</span>
        </div>
        <div class="header-user">
            <span id="userName" class="user-name-display"></span>
            <button class="logout-btn" onclick="handleLogout()">خروج</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Levels Grid -->
        <div class="levels-grid" id="levelsGrid">
            <!-- Levels 1–12 generated by JS -->
        </div>

    </main>

    <!-- Subject Modal -->
    <div class="modal-overlay hidden" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">المواد</h3>
                <button class="modal-close" onclick="closeModalDirect()">✕</button>
            </div>
            <div class="subjects-grid" id="subjectsGrid">
                <!-- Subjects injected by JS -->
            </div>
        </div>
    </div>

    <script src="script/script.js"></script>
</body>
</html>
